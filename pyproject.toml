[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbardflow"
version = "0.1.2"
description = "HubbardFlow — Reproducible workflows for first-principles Hubbard parameter determination and certification."
dependencies = [
    "numpy>=1.20.0,<2.0.0",
    "jsonschema>=4.0.0,<5.0.0"
]

[project.scripts]
hubbardflow = "hubbardflow.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
include = [
    "src/hubbardflow/execution/campaign_split.py",
    "src/hubbardflow/siesta_backend/split_generated_identity.py",
    "tools/hubbardflow_verify_split_identity.py",
    "tests/unit/test_campaign_split.py",
    "tests/unit/test_split_generated_identity.py",
    "src/hubbardflow/product_cli.py",
    "src/hubbardflow/execution/product_*.py",
    "src/hubbardflow/reporting/product_report.py",
    "tests/unit/test_product_*.py",
    "src/hubbardflow/siesta_backend/scf_ladder_inputs.py",
    "src/hubbardflow/domain/scf_*.py",
    "tests/unit/test_scf_*.py",
    "src/hubbardflow/domain/validation.py",
    "src/hubbardflow/domain/fdebq_*.py",
    "tests/unit/test_fdebq_*.py",
    "src/hubbardflow/domain/response_*.py",
    "src/hubbardflow/domain/subspace_inventory.py",
    "src/hubbardflow/domain/state_evidence.py",
    "src/hubbardflow/domain/coverage.py",
    "src/hubbardflow/domain/coverage_models.py",
    "src/hubbardflow/domain/perturbation_plan*.py",
    "src/hubbardflow/execution/campaign_plan.py",
    "src/hubbardflow/execution/campaign_coverage_policy.py",
    "tests/unit/test_coverage_features.py",
    "tests/science/test_coverage_negative_controls.py",
    "src/hubbardflow/execution/campaign_pilot_reuse.py",
    "src/hubbardflow/execution/campaign_shadow*.py",
    "tests/unit/test_campaign_shadow.py",
    "tests/unit/test_campaign_plan.py",
    "tests/unit/test_campaign_manifest_plan.py",
    "tests/unit/test_perturbation_plan*.py",
    "src/hubbardflow/domain/symmetry_operation_models.py",
    "src/hubbardflow/domain/symmetry_operations.py",
    "src/hubbardflow/domain/symmetry_geometry.py",
    "src/hubbardflow/domain/symmetry_groups.py",
    "src/hubbardflow/siesta_backend/fdf_model.py",
    "src/hubbardflow/siesta_backend/semantic_species_split.py",
    "src/hubbardflow/siesta_backend/semantic_ion_identity.py",
    "src/hubbardflow/siesta_backend/semantic_split_models.py",
    "tests/unit/test_semantic_species_split.py",
    "src/hubbardflow/siesta_backend/reference_state_evidence.py",
    "src/hubbardflow/siesta_backend/coverage_reference.py",
    "tools/hubbardflow_plan_diagnose.py",
    "tests/unit/test_coverage.py",
    "tests/unit/test_response_*.py",
    "tests/unit/test_subspace_inventory.py",
    "tests/unit/test_state_evidence.py",
    "tests/unit/test_symmetry_operations.py",
    "tests/unit/test_fdf_model.py",
    "tests/unit/test_validation.py",
    "tools/fdebq_*.py",
    "tools/v1_retrospective.py",
]

[tool.mypy]
strict = true
