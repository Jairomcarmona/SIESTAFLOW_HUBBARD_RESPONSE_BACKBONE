[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbardflow"
version = "0.1.2"
description = "HubbardFlow — Reproducible workflows for first-principles Hubbard parameter determination and certification."
dependencies = [
    "numpy>=1.20.0,<2.0.0",
    "jsonschema>=4.0.0,<5.0.0"
]

[project.scripts]
hubbardflow = "hubbardflow.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["symmetry_reduction_proposal"]

[tool.setuptools.packages.find]
where = ["src"]
