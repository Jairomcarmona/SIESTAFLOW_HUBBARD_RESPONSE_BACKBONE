    "src/hubbardflow/domain/response_*.py",
    "src/hubbardflow/domain/subspace_inventory.py",
    "src/hubbardflow/domain/state_evidence.py",
    "src/hubbardflow/domain/coverage.py",
    "src/hubbardflow/domain/coverage_models.py",
    "src/hubbardflow/domain/perturbation_plan*.py",
    "src/hubbardflow/execution/campaign_plan.py",
    "src/hubbardflow/execution/campaign_coverage_policy.py",
    "tests/unit/test_coverage_features.py",
