[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbardflow"
version = "0.1.2"
description = "HubbardFlow — Reproducible workflows for first-principles Hubbard parameter determination and certification."
dependencies = [
    "numpy>=1.20.0,<2.0.0",
    "jsonschema>=4.0.0,<5.0.0"
]

[project.scripts]
hubbardflow = "hubbardflow.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
include = ["src/*.py", "src/**/*.py", "tests/*.py", "tests/**/*.py"]
