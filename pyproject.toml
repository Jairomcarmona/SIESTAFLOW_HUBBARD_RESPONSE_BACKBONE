    "src/hubbardflow/siesta_backend/semantic_species_split.py",
    "src/hubbardflow/siesta_backend/semantic_ion_identity.py",
    "src/hubbardflow/siesta_backend/semantic_split_models.py",
    "tests/unit/test_semantic_species_split.py",
    "src/hubbardflow/siesta_backend/reference_state_evidence.py",
    "src/hubbardflow/siesta_backend/coverage_reference.py",
    "tools/hubbardflow_plan_diagnose.py",
    "tests/unit/test_coverage.py",
    "tests/unit/test_response_*.py",
    "tests/unit/test_subspace_inventory.py",
    "tests/unit/test_state_evidence.py",
    "tests/unit/test_symmetry_operations.py",
    "tests/unit/test_fdf_model.py",
    "tests/unit/test_validation.py",
    "tools/fdebq_*.py",
    "tools/v1_retrospective.py",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["symmetry_reduction_proposal"]

[tool.setuptools.packages.find]
where = ["src"]
