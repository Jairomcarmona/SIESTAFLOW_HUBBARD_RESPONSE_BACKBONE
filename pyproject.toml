[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hubbardflow"
version = "0.1.2"
description = "HubbardFlow — Reproducible workflows for first-principles Hubbard parameter determination and certification."
dependencies = [
    "numpy>=1.20.0,<2.0.0",
    "jsonschema>=4.0.0,<5.0.0"
]

[project.scripts]
hubbardflow = "hubbardflow.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.ruff]
line-length = 110
target-version = "py312"
include = [
    "src/hubbardflow/domain/validation.py",
    "src/hubbardflow/domain/response_*.py",
    "src/hubbardflow/domain/subspace_inventory.py",
    "src/hubbardflow/domain/state_evidence.py",
    "src/hubbardflow/domain/symmetry_operation_models.py",
    "src/hubbardflow/domain/symmetry_operations.py",
    "src/hubbardflow/domain/symmetry_geometry.py",
    "src/hubbardflow/domain/symmetry_groups.py",
    "src/hubbardflow/siesta_backend/fdf_model.py",
    "src/hubbardflow/siesta_backend/reference_state_evidence.py",
    "tests/unit/test_response_*.py",
    "tests/unit/test_subspace_inventory.py",
    "tests/unit/test_state_evidence.py",
    "tests/unit/test_symmetry_operations.py",
    "tests/unit/test_fdf_model.py",
    "tests/unit/test_validation.py",
    "tools/fdebq_*.py",
]

[tool.mypy]
strict = true
files = [
    "src/hubbardflow/domain/validation.py",
    "src/hubbardflow/domain/response_*.py",
    "src/hubbardflow/domain/subspace_inventory.py",
    "src/hubbardflow/domain/state_evidence.py",
    "src/hubbardflow/domain/symmetry_operation_models.py",
    "src/hubbardflow/domain/symmetry_operations.py",
    "src/hubbardflow/domain/symmetry_geometry.py",
    "src/hubbardflow/domain/symmetry_groups.py",
    "src/hubbardflow/siesta_backend/fdf_model.py",
    "src/hubbardflow/siesta_backend/reference_state_evidence.py",
    "tests/unit/test_response_*.py",
    "tests/unit/test_subspace_inventory.py",
    "tests/unit/test_state_evidence.py",
    "tests/unit/test_symmetry_operations.py",
    "tests/unit/test_fdf_model.py",
    "tests/unit/test_validation.py",
    "tools/fdebq_*.py",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["symmetry_reduction_proposal"]

[tool.setuptools.packages.find]
where = ["src"]
